[package]
name = "llama-rust"
version = "0.1.0"
edition = "2021"
description = "Safe Rust GGUF-native Llama decode. No llama.cpp bind."


[lib]
name = "llama_rust"
path = "src/lib.rs"

[[bin]]
name = "gguf_gemv"
path = "src/main.rs"

[[bin]]
name = "extra"
path = "src/extra.rs"

[lints]
workspace = true

