[package]
name = "llama-rust"
version = "0.1.0"
edition = "2021"
description = "Verifiable GGUF v3 Llama-family reference engine: oracle decode, MoE traces, ExpertStore seam."
license = "MIT"
readme = "../README.md"
repository = "https://github.com/mingley/llama-rust"
keywords = ["gguf", "llm", "llama", "moe", "inference"]
categories = ["science"]

[features]
default = ["simd"]
# Vendor SIMD fast path for the hot dtypes. Off means the crate compiles under a
# crate-level `forbid(unsafe_code)`; see `src/lib.rs`.
simd = []

[dependencies]
expertvm = { path = "../expertvm" }

[lib]
name = "llama_rust"
path = "src/lib.rs"

[[bin]]
name = "gguf_gemv"
path = "src/main.rs"

[[bin]]
name = "extra"
path = "src/extra.rs"

[lints]
workspace = true

