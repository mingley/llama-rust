[package]
name = "llama-rust"
version = "0.2.0"
edition = "2021"
# The default SIMD path uses AArch64 FP16 intrinsics stabilized in Rust 1.94.
rust-version = "1.94"
description = "Verifiable GGUF v3 Llama-family reference engine with oracle decode, MoE traces, and an ExpertStore seam"
documentation = "https://docs.rs/llama-rust"
homepage = "https://github.com/mingley/llama-rust"
repository = "https://github.com/mingley/llama-rust"
license = "MIT"
readme = "README.md"
keywords = ["llama", "gguf", "llm", "inference", "quantization"]
categories = ["science", "text-processing", "command-line-utilities"]
exclude = ["*.c", "*.m", "*.metal"]

[features]
default = ["simd"]
# Vendor SIMD fast path for the hot dtypes. Off means the crate compiles under a
# crate-level `forbid(unsafe_code)`; see `src/lib.rs`.
simd = []

[dependencies]
expertvm = { path = "../expertvm", version = "0.1.0" }

[lib]
name = "llama_rust"
path = "src/lib.rs"

[[bin]]
name = "gguf_gemv"
path = "src/main.rs"

[lints]
workspace = true
