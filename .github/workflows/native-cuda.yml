name: native-cuda

# This validates the actual default backend on a CUDA-equipped runner.
# CPU oracle CI is separate and explicitly disables default features.
on:
  workflow_dispatch:

jobs:
  gpu:
    runs-on: [self-hosted, linux, x64, cuda]
    steps:
      - uses: actions/checkout@v4
      # Runner requirements: pinned cargo-oxide, CUDA >=13, NVIDIA driver,
      # libclang, Rust 1.99.1 and its compiler development components.
      - run: cargo +1.99.1 oxide doctor
      - name: Validate Rust kernels against scalar oracle
        run: |
          cargo +1.99.1 oxide build -- --release -p llama-native-cuda --bin native-gemv
          ./target/release/native-gemv
      - name: Check quantized model dispatch against CPU row oracle
        run: cargo +1.99.1 oxide test -- --release -p llama-rust --test native_cuda_parity -- --test-threads=1
      - name: Validate native cache configuration
        run: cargo +1.99.1 oxide test -- --release -p llama-rust --lib native_gpu::tests
      - name: Build default inference backend
        run: cargo +1.99.1 oxide build -- --release -p llama-rust --bin gguf_gemv
      - name: Run default backend inference
        run: |
          ./target/release/gguf_gemv write-tiny /tmp/native-tiny.gguf
          ./target/release/gguf_gemv infer /tmp/native-tiny.gguf --prompt ab --n-predict 4
