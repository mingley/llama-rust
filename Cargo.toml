[workspace]
members = ["langtax", "gpu-sim"]
resolver = "2"

[workspace.lints.rust]
missing_docs = "deny"
# `deny`, not `forbid`, so the SIMD kernels can opt in with an `expect` and a
# written reason. Everything outside `langtax/src/simd/` stays unsafe-free, and
# `--no-default-features` restores a crate-level `forbid` (see `langtax/src/lib.rs`).
unsafe_code = "deny"
unreachable_pub = "warn"
unused_must_use = "deny"
unused_results = "deny"

[workspace.lints.clippy]
# Restriction/pedantic lints that are allow or warn by default.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
mem_forget = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
await_holding_invalid_type = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
lossy_float_literal = "deny"
